 sp_magical_earth_shatter_crystal_projectiles_vnr_desc: "Although crystals typically carry a somewhat containable amount of energy which requires considerable effort to release, it seems as though it is possible - particularly with large crystals - to force additional energy inside them. The more energy contained, the more fragile the crystal and the greater propensity it has for detonating spectacularly. Perhaps unsurprisingly, some bright minds in navy had the genius idea of turning these concerningly volatile crystals as HE filler inside SAP and APHE shells."
 
